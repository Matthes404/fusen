name: Builds

# Installierbare Pakete zum Ausprobieren, ohne selbst zu bauen – als
# Artefakte am Lauf, 14 Tage lang:
# * nach jedem Push auf main,
# * auf jedem anderen Branch, sobald sich etwas Natives ändert: ein neues
#   Plugin, Plattform-Einstellungen, die Paketierung. Analyse und Tests
#   fassen nichts davon an; es fällt erst beim Bauen auf – und soll das vor
#   dem Merge tun,
# * von Hand über „Run workflow“.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Planen
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          name="$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)"
          echo "version=$name-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" != push ] || [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Womit vergleichen: mit dem Stand vor dem Push, bei einem neuen
          # Branch mit seinem Abzweig vom Standard-Branch.
          base=""
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="$(git merge-base "origin/$DEFAULT_BRANCH" "$GITHUB_SHA" 2>/dev/null || true)"
          fi

          if [ -z "$base" ]; then
            build=true
          elif git diff --name-only "$base" "$GITHUB_SHA" |
            grep -qE '^(\.github/workflows/(build|package)\.yml|app/pubspec\.(yaml|lock)|app/(android|ios|linux|macos|windows)/)'; then
            build=true
          else
            build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Native Änderungen seit ${base:-?}: $build"

  packages:
    name: Pakete
    needs: plan
    if: needs.plan.outputs.build == 'true'
    # Hier und nicht für den ganzen Workflow: ein Push, der nichts Natives
    # ändert, soll einen laufenden Build nicht abbrechen und dann selbst
    # nichts bauen.
    concurrency:
      group: builds-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      retention-days: 14
    secrets: inherit
