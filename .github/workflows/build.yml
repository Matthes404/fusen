name: Builds

# Nach jedem Merge auf main gibt es ein installierbares Build zum
# Ausprobieren – ohne dass jemand lokal bauen muss.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.3

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android (APK)
            os: ubuntu-latest
            target: apk
            artifact: fusen-android
            path: app/build/app/outputs/flutter-apk/app-debug.apk
          - name: Linux
            os: ubuntu-latest
            target: linux
            artifact: fusen-linux
            path: app/build/linux/x64/debug/bundle
          - name: Windows
            os: windows-latest
            target: windows
            artifact: fusen-windows
            path: app/build/windows/x64/runner/Debug
          - name: macOS
            os: macos-latest
            target: macos
            artifact: fusen-macos
            path: app/build/macos/Build/Products/Debug
          - name: iOS (unsigniert)
            os: macos-latest
            target: ios
            artifact: fusen-ios
            path: app/build/ios/iphoneos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '17'

      - name: Linux-Abhängigkeiten
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pakete holen
        working-directory: app
        run: flutter pub get

      - name: Bauen
        working-directory: app
        # iOS ohne Signierung: zum Ausprobieren im Simulator reicht das,
        # signiert wird erst für den App Store.
        run: |
          if [ "${{ matrix.target }}" = "ios" ]; then
            flutter build ios --debug --no-codesign
          else
            flutter build ${{ matrix.target }} --debug
          fi
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14
