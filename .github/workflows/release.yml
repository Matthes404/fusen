name: Release

# Ein GitHub-Release mit installierbaren Paketen für alle Plattformen und
# dem Server-Image. Zwei Wege dorthin:
# * „Actions → Release → Run workflow“ auf dem gewünschten Branch: der Lauf
#   liest die Version aus app/pubspec.yaml und legt den Tag v<version>
#   selbst an;
# * einen Tag v<version> pushen, der zur Version in app/pubspec.yaml passt.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Version prüfen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)"
          if [ -z "$version" ]; then
            echo "::error::Keine Version in app/pubspec.yaml gefunden."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Der Tag $GITHUB_REF_NAME passt nicht zur Version $version in app/pubspec.yaml."
            exit 1
          fi
          # Image-Namen müssen klein geschrieben sein, der Repository-Name
          # ist es nicht.
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-server"
          } >> "$GITHUB_OUTPUT"

  app:
    name: App
    needs: plan
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      retention-days: 7
    secrets: inherit

  server:
    name: Server-Image
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.plan.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Release veröffentlichen
    needs: [plan, app, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fusen-*
          path: dist
          merge-multiple: true

      - name: Prüfsummen
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Text
        # Die Vorlage steht in einem Heredoc mit 'EOF', damit Backticks und
        # Backslashes darin bleiben, was sie sind; eingesetzt werden danach
        # nur die Platzhalter @…@.
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          IMAGE: ${{ needs.plan.outputs.image }}
          SIGNED: ${{ needs.app.outputs.android-signed }}
        run: |
          WARNING=""
          if [ "$SIGNED" != true ]; then
            WARNING="$(cat <<'EOF'

          > [!WARNING]
          > Diese APK trägt noch keinen festen Signierschlüssel. Eine spätere Version lässt sich deshalb nicht darüber installieren, sondern erst nach dem Deinstallieren – und dabei gehen Zettel verloren, die nicht mit einem Sync-Server abgeglichen sind.
          EOF
          )"
          fi

          cat > notes.tmpl <<'EOF'
          ## Installieren

          **Android** – `fusen-@VERSION@-android.apk` auf dem Handy herunterladen und öffnen. Beim ersten Mal fragt Android, ob der Browser Apps installieren darf: erlauben.
          @WARNING@

          **iPhone und iPad** – `fusen-@VERSION@-ios-unsigniert.ipa` ist nicht signiert. Mit [AltStore](https://altstore.io) oder [Sideloadly](https://sideloadly.io) lässt sie sich über die eigene Apple-ID installieren (mit einer kostenlosen Apple-ID alle 7 Tage neu).

          **Windows 10 und 11** – `fusen-@VERSION@-windows-setup.exe` starten; installiert ohne Administratorrechte. Meldet SmartScreen „Der Computer wurde durch Windows geschützt“: „Weitere Informationen“ → „Trotzdem ausführen“. Ohne Installation: `fusen-@VERSION@-windows-x64.zip` entpacken und `fusen.exe` starten.

          **macOS** – `fusen-@VERSION@-macos.dmg` öffnen und Fusen auf „Applications“ ziehen. Die App ist nicht von Apple beglaubigt: beim ersten Start die Meldung schließen, dann unter *Systemeinstellungen → Datenschutz & Sicherheit* „Dennoch öffnen“ wählen.

          **Linux** – Debian, Ubuntu, Mint: `sudo apt install ./fusen-@VERSION@-linux-amd64.deb`. Andere Distributionen: `fusen-@VERSION@-linux-x64.tar.gz` entpacken und `fusen` starten (braucht GTK 3 und libkeybinder-3.0).

          Die Prüfsummen aller Dateien stehen in `SHA256SUMS.txt`.

          ## Sync-Server (optional)

          Ohne Server bleibt alles auf dem Gerät. Wer mehrere Geräte abgleichen will:

          ```bash
          docker run -d -p 127.0.0.1:8090:8090 \
            -e FUSEN_ACCESS_CODE=deincode \
            -v fusen_data:/pb/pb_data \
            @IMAGE@:@VERSION@
          ```

          Einrichtung Schritt für Schritt: [server/README.md](https://github.com/@REPOSITORY@/blob/v@VERSION@/server/README.md)
          EOF
          notes="$(< notes.tmpl)"
          notes="${notes//@VERSION@/"$VERSION"}"
          notes="${notes//@IMAGE@/"$IMAGE"}"
          notes="${notes//@WARNING@/"$WARNING"}"
          notes="${notes//@REPOSITORY@/"$GITHUB_REPOSITORY"}"
          printf '%s\n' "$notes" | tee notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Fusen ${{ needs.plan.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(needs.plan.outputs.version, '-') }}
          files: dist/*
          fail_on_unmatched_files: true
