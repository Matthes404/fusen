name: Release

# Ein Tag v* erzeugt Release-Builds für alle Plattformen, hängt sie an ein
# GitHub-Release und schiebt das Server-Image nach GHCR.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  FLUTTER_VERSION: 3.47.3

jobs:
  app:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android (APK)
            os: ubuntu-latest
            target: apk
            artifact: fusen-android
          - name: Linux
            os: ubuntu-latest
            target: linux
            artifact: fusen-linux
          - name: Windows
            os: windows-latest
            target: windows
            artifact: fusen-windows
          - name: macOS
            os: macos-latest
            target: macos
            artifact: fusen-macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '17'

      - name: Linux-Abhängigkeiten
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pakete holen
        working-directory: app
        run: flutter pub get

      - name: Bauen
        working-directory: app
        run: flutter build ${{ matrix.target }} --release

      - name: Zusammenpacken
        working-directory: app
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p ../dist
          case "${{ matrix.target }}" in
            apk)
              mv build/app/outputs/flutter-apk/app-release.apk \
                 "../dist/fusen-${version}-android.apk"
              ;;
            linux)
              tar -C build/linux/x64/release -czf \
                "../dist/fusen-${version}-linux-x64.tar.gz" bundle
              ;;
            windows)
              7z a "../dist/fusen-${version}-windows-x64.zip" \
                ./build/windows/x64/runner/Release/*
              ;;
            macos)
              ditto -c -k --sequesterRsrc --keepParent \
                build/macos/Build/Products/Release/fusen.app \
                "../dist/fusen-${version}-macos.zip"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  server:
    name: Server-Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Release veröffentlichen
    needs: [app, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          body: |
            ## Installieren

            * **Android**: die `.apk` herunterladen und öffnen
              (Installation aus unbekannter Quelle erlauben).
            * **Linux**: `.tar.gz` entpacken, `bundle/fusen` starten.
            * **Windows**: `.zip` entpacken, `fusen.exe` starten.
            * **macOS**: `.zip` entpacken, `fusen.app` nach „Programme“ ziehen.

            ## Sync-Server

            ```bash
            docker run -d -p 127.0.0.1:8090:8090 \
              -e FUSEN_ACCESS_CODE=deincode \
              -v fusen_data:/pb/pb_data \
              ghcr.io/${{ github.repository }}-server:latest
            ```

            Einrichtung Schritt für Schritt: [server/README.md](server/README.md).
