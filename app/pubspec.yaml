name: fusen
description: "Fusen – ein digitaler Stapel Haftnotizen, sortiert nach Projekt."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Lokale Datenbank (local-first)
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path: ^1.9.0
  path_provider: ^2.1.6

  # State management
  flutter_riverpod: ^3.4.3

  # Sync
  pocketbase: ^0.25.1

  # Darstellung
  flutter_markdown_plus: ^1.0.12
  intl: ^0.20.2
  url_launcher: ^6.3.2

  # IDs
  uuid: ^4.6.0

  # Desktop-Integration (globaler Hotkey, Fenstersteuerung)
  hotkey_manager: ^0.2.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  sqlite3: ^3.5.2

flutter:
  uses-material-design: true
