name: fusen
description: "Fusen – ein digitaler Stapel Haftnotizen, sortiert nach Projekt."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Lokale Datenbank (local-first)
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path: ^1.9.0
  path_provider: ^2.1.6

  # State management
  flutter_riverpod: ^3.4.3

  # Sync
  pocketbase: ^0.25.1
  # Bilder herunterladen – PocketBase liefert nur die Adresse.
  http: ^1.6.0

  # Darstellung
  flutter_markdown_plus: ^1.0.12
  intl: ^0.20.2
  url_launcher: ^6.3.2

  # IDs
  uuid: ^4.6.0

  # Bilder verkleinern, bevor sie gespeichert und abgeglichen werden
  image: ^4.10.1

  # Desktop-Integration (globaler Hotkey, Fenstersteuerung)
  hotkey_manager: ^0.2.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  sqlite3: ^3.5.2

flutter:
  uses-material-design: true

  assets:
    # Die Lizenzen der Schriften – die OFL verlangt, dass sie mitreisen.
    - assets/fonts/PlusJakartaSans-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt

  # Mitgeliefert statt vom System geborgt: sonst sieht Fusen unter Linux
  # nach DejaVu aus, unter Windows nach Segoe und auf dem Handy nach Roboto.
  # Auf Latein und Satzzeichen beschnitten; andere Schriftsysteme holt sich
  # Flutter weiter vom System.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          style: italic
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
